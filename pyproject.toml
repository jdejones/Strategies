[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategies"
version = "0.1.0"
description = "Statistical analysis and backtrader backtesting toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "backtrader>=1.9.78.123",
  "pandas>=1.5",
]

[tool.setuptools.packages.find]
include = ["strategies*"]
